<!doctype html>
<html lang="es-PY" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agro-platform · mockup de pantallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F2F4F1; --panel:#FFFFFF; --panel-2:#EAEEE9;
  --ink:#07120C; --ink-2:#2C3D33; --ink-3:#5E6E64;
  --line:#BECABE; --line-2:#A3B2A4;
  --brand:#0B4A56; --brand-2:#08333C; --brand-wash:#DDEBEE;
  --ok:#216B3A; --warn:#9C5504; --crit:#9B1D28; --mute:#5F6F65;
  --ok-wash:#DDECE1; --warn-wash:#F5E6D2; --crit-wash:#F6DEDF; --mute-wash:#E4E9E4;
  --s1:#0284A8; --s2:#C06A05; --s3:#7C3AED; --s4:#BE123C;
  --d1:#6FAAC6; --d2:#1A5C7A; --d3:#0B3247;
  --n1:#98B478; --n2:#6F9B4D; --n3:#4F8235; --n4:#2A5A20; --n5:#113312;
  --grid:#DEE4DD; --axis:#AEBBAD;
  --rail:246px;
  /* Se usa al sol, en un telefono barato, con las manos sucias: esto NO es
     una preferencia, es el caso de uso. */
  --fs:18px; --tap:56px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#101512; --panel:#1A211D; --panel-2:#232C27;
  --ink:#FFFFFF; --ink-2:#CCD9D0; --ink-3:#93A399;
  --line:#3B4A43; --line-2:#4C5C54;
  --brand:#67C2D2; --brand-2:#9BDCE8; --brand-wash:#17302F;
  --ok:#57BA76; --warn:#DFA02C; --crit:#EC7079; --mute:#93A399;
  --ok-wash:#17301F; --warn-wash:#2F2615; --crit-wash:#31191C; --mute-wash:#242C27;
  --s1:#2AA3C6; --s2:#BD780C; --s3:#9B7BF5; --s4:#E5566F;
  --d1:#2E7FA3; --d2:#57A3C2; --d3:#8FC6DC;
  --n1:#2A5A20; --n2:#4F8235; --n3:#6F9B4D; --n4:#98B478; --n5:#C3D6AC;
  --grid:#28322C; --axis:#415048;
}
:root[data-big="1"]{ --fs:21px; --tap:62px; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-variation-settings:"wdth" 100;
  font-size:var(--fs); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0; font-weight:650; font-variation-settings:"wdth" 112; letter-spacing:-.012em; line-height:1.18}
h1{font-size:1.72rem} h2{font-size:1.22rem} h3{font-size:1rem} h4{font-size:.9rem}
p{margin:0 0 10px; max-width:66ch}
a{color:var(--brand); text-underline-offset:3px}
button,input,select{font:inherit; font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--brand); outline-offset:2px; border-radius:2px}
code{font-family:inherit}

.flag{
  background:repeating-linear-gradient(135deg,var(--warn-wash) 0 12px,transparent 12px 24px);
  border-bottom:2px solid var(--line-2);
  padding:8px 14px; font-size:.8rem; color:var(--ink-2);
  font-variation-settings:"wdth" 92; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.flag b{color:var(--ink); font-weight:700; font-variation-settings:"wdth" 108}
.flag .sp{flex:1 1 20px}
.flag .sm{display:none}
@media (max-width:560px){ .flag .lg{display:none} .flag .sm{display:inline} .flag{padding:7px 12px; gap:8px} }

.minibtn{border:2px solid var(--line-2); background:var(--panel); color:var(--ink-2); border-radius:3px; padding:4px 10px; font-size:.78rem; cursor:pointer}

.shell{display:grid; grid-template-columns:var(--rail) 1fr; min-height:100vh}
.rail{border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:auto}
.brand{display:flex; gap:10px; align-items:center; padding:16px 16px 14px; border-bottom:1px solid var(--line)}
.brand .nm{font-weight:750; font-variation-settings:"wdth" 116; letter-spacing:-.02em; font-size:1rem; line-height:1}
.brand .sub{font-size:.7rem; color:var(--ink-3); font-variation-settings:"wdth" 86; line-height:1.3}
.cliente{padding:12px 16px; border-bottom:1px solid var(--line)}
.cliente label{display:block; font-size:.72rem; color:var(--ink-3); font-variation-settings:"wdth" 86; margin-bottom:4px}
.cliente select{width:100%; font-size:.85rem; background:var(--panel-2); color:var(--ink); border:1px solid var(--line-2); border-radius:2px; padding:7px 8px}
nav{padding:8px 8px 24px; flex:1}
.navgroup{font-size:.72rem; color:var(--ink-3); font-variation-settings:"wdth" 86; padding:14px 8px 5px}
.navlink{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:9px 8px; border:0; background:none; color:var(--ink-2); cursor:pointer; font-size:.88rem; border-radius:2px; position:relative; min-height:var(--tap)}
.navlink svg{flex:none; opacity:.8}
.navlink:hover{background:var(--panel-2); color:var(--ink)}
.navlink[aria-current="page"]{color:var(--ink); font-weight:650; background:var(--brand-wash)}
.navlink[aria-current="page"]::before{content:""; position:absolute; left:-8px; top:4px; bottom:4px; width:4px; background:var(--brand)}
.navlink[aria-current="page"] svg{opacity:1}
.navlink .badge{margin-left:auto; font-size:.72rem; background:var(--crit); color:#fff; border-radius:9px; padding:1px 7px; font-variation-settings:"wdth" 88}
:root[data-theme="dark"] .navlink .badge{color:#12100f}

main{min-width:0; padding:0 0 92px}
.wrap{max-width:1180px; padding:20px 20px 0}
.pagehead{border-bottom:2px solid var(--line); padding-bottom:14px; margin-bottom:18px}
.crumb{font-size:.74rem; color:var(--ink-3); font-variation-settings:"wdth" 88; margin-bottom:5px}
.pagehead .decision{margin-top:7px; font-size:.86rem; color:var(--ink-2); max-width:72ch}
.pagehead .decision b{color:var(--ink); font-weight:650}

/* ---------- la respuesta: lo primero y lo mas grande de cada pantalla ---------- */
.answer{display:flex; gap:14px; align-items:flex-start; border:2px solid var(--line-2); border-left-width:8px; border-radius:4px; background:var(--panel); padding:16px 16px; margin-bottom:16px}
.answer.ok{border-color:var(--ok); background:var(--ok-wash)}
.answer.do{border-color:var(--brand); background:var(--brand-wash)}
.answer.warn{border-color:var(--warn); background:var(--warn-wash)}
.answer.crit{border-color:var(--crit); background:var(--crit-wash)}
.answer.mute{border-color:var(--mute); background:var(--mute-wash)}
.answer .ic{flex:none; margin-top:2px}
.answer .tx{min-width:0}
.answer .big{font-size:1.5rem; font-weight:750; font-variation-settings:"wdth" 116; letter-spacing:-.02em; line-height:1.14}
.answer .sub{margin-top:6px; font-size:.95rem; color:var(--ink-2); max-width:44ch}
.answer .sub b{color:var(--ink)}
.answer .when{margin-top:9px; font-size:.84rem; color:var(--ink-2); display:flex; align-items:center; gap:7px; font-weight:600}

.freshness{display:flex; align-items:center; gap:8px; border:2px solid var(--line-2); border-radius:3px; background:var(--panel); padding:9px 12px; margin-bottom:14px; font-size:.88rem; font-weight:600}
.freshness.stale{border-color:var(--mute); background:var(--mute-wash)}
.freshness.dato{border-color:var(--brand); background:var(--brand-wash)}
.freshness.dato b{font-size:1.05rem}

.panel{background:var(--panel); border:1px solid var(--line); border-radius:3px; margin-bottom:16px}
.panel > header{padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
.panel > header .hint{font-size:.78rem; color:var(--ink-3); font-variation-settings:"wdth" 88; margin-left:auto}
.panel .body{padding:14px}
.panel .body.flush{padding:0}
.cols{display:grid; gap:16px}
.cols.c2{grid-template-columns:1fr 1fr}
.cols.map{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
.filas{display:grid; gap:0 12px; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); align-items:start}
.note{font-size:.82rem; color:var(--ink-2); font-variation-settings:"wdth" 94; line-height:1.48}
.note.rule{border-left:3px solid var(--brand); padding-left:11px}
.muted{color:var(--ink-3)}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(158px,1fr)); gap:1px; margin:1px 1px 17px}
.tile{background:var(--panel); outline:1px solid var(--line); padding:12px 14px; min-width:0}
.tile .k{font-size:.76rem; color:var(--ink-3); font-variation-settings:"wdth" 88}
.tile .v{font-size:1.65rem; font-weight:750; font-variation-settings:"wdth" 118; letter-spacing:-.02em; line-height:1.15; margin-top:3px}
.tile .v small{font-size:.8rem; font-weight:500; font-variation-settings:"wdth" 96; color:var(--ink-2); letter-spacing:0; margin-left:4px}
.tile .f{font-size:.76rem; color:var(--ink-3); font-variation-settings:"wdth" 90; margin-top:3px}

/* El estado nunca se dice solo con color: va figura + palabra. Al sol un verde y un
   naranja se parecen, y un daltonico no los distingue nunca. */
.chip{display:inline-flex; align-items:center; gap:6px; font-size:.78rem; font-variation-settings:"wdth" 92; font-weight:700;
  padding:3px 9px 3px 7px; border-radius:2px; border:2px solid transparent; white-space:nowrap}
.chip .g{width:10px; height:10px; flex:none}
.chip.ok{background:var(--ok-wash); color:var(--ok); border-color:var(--ok)}
.chip.warn{background:var(--warn-wash); color:var(--warn); border-color:var(--warn)}
.chip.crit{background:var(--crit-wash); color:var(--crit); border-color:var(--crit)}
.chip.mute{background:var(--mute-wash); color:var(--ink-2); border-color:var(--line-2)}
.chip.do{background:var(--brand-wash); color:var(--brand); border-color:var(--brand)}
.chip.do .g{background:var(--brand); clip-path:polygon(50% 0,100% 62%,78% 100%,22% 100%,0 62%)}
.chip.ok .g{background:var(--ok); border-radius:50%}
.chip.warn .g{background:var(--warn); clip-path:polygon(50% 0,100% 100%,0 100%)}
.chip.crit .g{background:var(--crit); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.chip.mute .g{background:none; border:2px dashed var(--ink-3); border-radius:50%}

/* ---------- lista de lotes: una fila grande, tocable con el pulgar ---------- */
.bigrow{display:grid; grid-template-columns:8px 1fr auto; width:100%; text-align:left; background:var(--panel);
  border:1px solid var(--line); border-radius:3px; padding:0; margin-bottom:10px; cursor:pointer; color:inherit; font:inherit; min-height:var(--tap)}
.bigrow:hover,.bigrow.hot{background:var(--panel-2)}
.bigrow .bar{border-radius:2px 0 0 2px}
.bigrow .mid{padding:12px 14px; min-width:0}
.bigrow .nm{display:block; font-weight:700; font-size:1.06rem; font-variation-settings:"wdth" 108}
.bigrow .act{display:block; font-size:1rem; margin-top:3px}
.bigrow .meta{display:block; font-size:.8rem; color:var(--ink-2); margin-top:5px; font-variation-settings:"wdth" 92}
.bigrow .right{padding:12px 14px 12px 0; display:flex; align-items:center; gap:10px}

/* ---------- el agua en la tierra, en palabras ---------- */
.wsoil{display:grid; gap:10px}
.wrow{display:grid; grid-template-columns:6.6rem 1fr auto; gap:10px; align-items:center}
.wrow .lb{font-size:.9rem; font-weight:600}
.wrow .lb small{display:block; font-weight:400; font-size:.74rem; color:var(--ink-3)}
.wrow .tk{height:22px; background:var(--panel-2); border:1px solid var(--line-2); border-radius:2px; position:relative; overflow:hidden}
.wrow .fl{position:absolute; inset:0 auto 0 0; background:var(--d2)}
.wrow .fl.seco{background:repeating-linear-gradient(135deg,var(--warn) 0 6px,color-mix(in srgb,var(--warn) 70%,#000) 6px 12px)}
.wrow .vw{font-size:.88rem; font-weight:700; min-width:4.4rem; display:flex; align-items:center; gap:6px}

details.disclose{border:1px solid var(--line); border-radius:3px; background:var(--panel); margin-bottom:16px}
details.disclose > summary{list-style:none; cursor:pointer; padding:13px 14px; display:flex; align-items:center; gap:9px; font-weight:650; min-height:var(--tap); font-size:.95rem}
details.disclose > summary::-webkit-details-marker{display:none}
details.disclose > summary .cv{margin-left:auto; transition:transform .15s}
details[open].disclose > summary .cv{transform:rotate(180deg)}
details.disclose .inner{padding:0 14px 14px; border-top:1px solid var(--line)}

table{width:100%; border-collapse:collapse; font-size:.86rem}
th{text-align:left; font-weight:650; font-size:.76rem; color:var(--ink-3); font-variation-settings:"wdth" 88; padding:9px 12px; border-bottom:2px solid var(--line-2); white-space:nowrap}
td{padding:11px 12px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:right}
.scroller{overflow-x:auto}
.why{font-size:.76rem; color:var(--ink-3); font-variation-settings:"wdth" 92; line-height:1.4; display:block; margin-top:2px}

.btn{border:2px solid var(--line-2); background:var(--panel); color:var(--ink); border-radius:3px; padding:8px 13px; font-size:.86rem; cursor:pointer; min-height:var(--tap); display:inline-flex; align-items:center; gap:8px}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
:root[data-theme="dark"] .btn.primary{color:#08130f}
.btn.primary:hover{background:var(--brand-2)}
.btn.block{width:100%; justify-content:flex-start; font-size:1rem; font-weight:650; padding:14px 16px}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.seg{display:inline-flex; border:2px solid var(--line-2); border-radius:3px; overflow:hidden}
.seg button{border:0; background:var(--panel); color:var(--ink-2); padding:8px 12px; font-size:.84rem; cursor:pointer; border-right:2px solid var(--line-2); min-height:var(--tap)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand-wash); color:var(--ink); font-weight:700}

.kv{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; font-size:.86rem; align-items:baseline}
.kv dt{color:var(--ink-3); font-size:.78rem; font-variation-settings:"wdth" 90}
.kv dd{margin:0}

.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:.78rem; color:var(--ink-2); font-variation-settings:"wdth" 92; align-items:center}
.legend span{display:inline-flex; gap:6px; align-items:center}
.legend i{width:16px; height:3px; border-radius:2px; display:block}
.legend i.sq{width:12px; height:12px; border-radius:2px}

.chart{position:relative}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.tip{position:fixed; z-index:60; pointer-events:none; background:var(--panel); border:2px solid var(--line-2); border-radius:3px; padding:9px 11px; font-size:.82rem; box-shadow:0 4px 14px rgba(0,0,0,.14); min-width:140px; opacity:0; transition:opacity .08s}
.tip .t{font-size:.74rem; color:var(--ink-3); font-variation-settings:"wdth" 88; margin-bottom:4px}
.tip .r{display:flex; gap:12px; justify-content:space-between; align-items:baseline}
.tip .r i{width:10px; height:10px; border-radius:2px; display:inline-block; margin-right:6px}

.mapfig{position:relative; background:var(--panel-2); border:1px solid var(--line-2); border-radius:3px;
  overflow:hidden; touch-action:none; height:340px}
.mapfig svg{display:block; width:100%; height:100%; cursor:grab}
.mapfig.moviendo svg{cursor:grabbing}
/* Por defecto el mapa toma el alto que queda en la ventana: entrar y verlo entero,
   sin deslizar. dvh y no vh, por la barra del navegador del telefono. */
.mapzone.alto .mapfig{height:clamp(300px, calc(100dvh - 20rem), 760px)}
@media (max-width:820px){ .mapzone.alto .mapfig{height:clamp(240px, calc(100dvh - 26rem), 640px)} }
[data-poly].elegido{stroke-width:5 !important}
.mapsvg[data-lod="1"] .lod2,.mapsvg[data-lod="1"] .lod3,.mapsvg[data-lod="2"] .lod3{display:none}

.mapctrl{position:absolute; right:10px; top:10px; z-index:12; display:flex; flex-direction:column; gap:6px}
.mapctrl button{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  width:58px; min-height:52px; border:2px solid var(--line-2); border-radius:3px; background:var(--panel);
  color:var(--ink); cursor:pointer; padding:4px 2px; box-shadow:0 1px 4px rgba(0,0,0,.14)}
.mapctrl button:hover{background:var(--panel-2)}
.mapctrl button b{font-size:1.25rem; line-height:1}
.mapctrl button span{font-size:.64rem; font-variation-settings:"wdth" 88; font-weight:650; line-height:1.1}
.capasbtn{position:absolute; left:10px; top:10px; z-index:12; display:none; align-items:center; gap:7px;
  min-height:48px; padding:6px 13px; border:2px solid var(--line-2); border-radius:3px;
  background:var(--panel); color:var(--ink); font-size:.86rem; font-weight:650; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,.14)}
.capascerrar{display:none; margin-left:auto; border:0; background:none; color:var(--ink-2); cursor:pointer; padding:4px; transform:rotate(-90deg)}

/* El mapa y su panel de capas. La leyenda vive AFUERA del dibujo: adentro se
   solapaba con los poligonos. Al costado en pantalla ancha, abajo en telefono. */
.mapzone{container-type:inline-size; position:relative}
.mapzone-in{display:grid; gap:14px; grid-template-columns:minmax(0,1fr); align-items:start}
/* El panel va al costado cuando el MAPA tiene lugar, no cuando la ventana es ancha:
   en "Hoy" el mapa comparte la fila con la lista de acciones y no siempre lo tiene. */
@container (min-width:760px){ .mapzone-in{grid-template-columns:minmax(0,1fr) minmax(214px,238px)} }
/* Cuando no entra al costado, el panel es un cajon que se abre desde el mapa:
   asi no le come alto justo en la pantalla donde el alto es todo. */
@container (max-width:759px){
  .mapzone-in{grid-template-columns:minmax(0,1fr)}
  .capas{position:absolute; z-index:30; right:0; top:0; height:100%; width:min(88%,330px);
    transform:translateX(103%); transition:transform .18s ease; overflow-y:auto; box-shadow:-6px 0 22px rgba(0,0,0,.26)}
  .capas.open{transform:none}
  .capasbtn{display:flex}
  .capascerrar{display:block}
}
@supports not (container-type: inline-size){
  @media (min-width:1200px){ .mapzone-in{grid-template-columns:minmax(0,1fr) minmax(214px,238px)} }
}

/* La ficha de lo elegido flota adentro del mapa, como en cualquier mapa: si va
   abajo del dibujo, con el mapa a pantalla completa queda fuera de la vista. */
.mapsel{display:none; position:absolute; left:10px; right:10px; bottom:46px; z-index:14;
  align-items:center; gap:10px; flex-wrap:wrap; padding:9px 11px; max-width:600px;
  border:2px solid var(--brand); border-radius:3px; background:var(--panel);
  box-shadow:0 2px 12px rgba(0,0,0,.18); min-height:var(--tap)}
.mapsel.on{display:flex}
.mapsel .tx{display:flex; flex-direction:column; min-width:0; flex:1}
.mapsel .tx b{font-size:1rem}
.mapsel .dt{font-size:.78rem; color:var(--ink-2); font-variation-settings:"wdth" 92}

.capas{border:1px solid var(--line); border-radius:3px; background:var(--panel); overflow:hidden}
.capas > h3{display:flex; align-items:center; gap:8px; padding:11px 12px; border-bottom:2px solid var(--line-2); font-size:.9rem}
.capagrp{border-bottom:1px solid var(--line)}
.capagrp:last-of-type{border-bottom:0}
.capafila{display:flex; align-items:center; min-height:var(--tap)}
.capafila.sel{background:var(--brand-wash)}
.capachk{display:flex; align-items:center; justify-content:center; width:46px; min-height:var(--tap); flex:none; cursor:pointer}
.capachk input{width:21px; height:21px; accent-color:var(--brand); cursor:pointer; margin:0}
.capalab{flex:1; display:flex; align-items:center; gap:9px; min-width:0; min-height:var(--tap);
  border:0; background:none; cursor:pointer; padding:5px 8px 5px 0; font:inherit; color:inherit; text-align:left}
.capalab:hover{background:var(--panel-2)}
.capalab .tx{display:flex; flex-direction:column; min-width:0}
.capalab .nm{font-size:.86rem; font-weight:650; line-height:1.25}
.capahijos .capalab .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.capalab .dt{font-size:.74rem; color:var(--ink-3); font-variation-settings:"wdth" 90}
.capaexp{width:44px; min-height:var(--tap); border:0; background:none; cursor:pointer; color:var(--ink-2); flex:none}
.capaexp svg{transition:transform .15s}
.capagrp[data-open="1"] .capaexp svg{transform:rotate(180deg)}
.capahijos{display:none; max-height:22rem; overflow-y:auto; border-top:1px solid var(--line); background:var(--panel-2)}
.capagrp[data-open="1"] .capahijos{display:block}
.capahijos .capafila{min-height:46px; border-bottom:1px solid var(--line)}
.capahijos .capafila:last-child{border-bottom:0}

    d += (open ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " "; open = true;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="display:block"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;
}

   Dos niveles: el CAMPO es el fondo -- contexto, limites, no se toca ni se apaga --
   y los POTREROS y LOTES son lo que se toca. Entre medio hay monte, camino, casco y
   tajamar, que no son de ningun potrero: por eso la suma de los potreros NO da el campo.

   Se maneja como un mapa: rueda y pellizco para el zoom, arrastre para mover, y
   botones para los que no pellizcan. SVG propio, sin librerias y sin mapa base de
   terceros -- esto no tiene conexion.

const centro = poly => {
  const pts = poly.split(" ").map(x => x.split(",").map(Number));

};

  const pts = poly.split(" ").map(x => x.split(",").map(Number));
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  return { x0: Math.min(...xs), y0: Math.min(...ys), x1: Math.max(...xs), y1: Math.max(...ys) };

/* ============================ manejo del mapa ============================ */
function mapaInteractivo(root) {
  const zona = $(".mapzone", root);
  if (!zona) return;
  const fig = $(".mapfig", zona), svg = $(".mapsvg", zona), panel = $("#capas", zona), selBox = $("#mapsel", zona);
  const world = $(".world", svg), marks = $(".marks", svg), chrome = $(".chrome", svg);
  let W = 0, H = 0, k = 1, tx = 0, ty = 0, elegido = null, arrastro = false;

  const clamp = v => Math.max(KMIN, Math.min(KMAX, v));
  const lod = () => k < 1.45 ? 1 : (k < 2.9 ? 2 : 3);

  function pintar() {
    world.setAttribute("transform", `translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${k.toFixed(4)})`);
    $$(".mk", marks).forEach(m => {
      m.setAttribute("transform", `translate(${(+m.dataset.wx * k + tx).toFixed(2)},${(+m.dataset.wy * k + ty).toFixed(2)})`);
    });
    svg.dataset.lod = lod();
    /* La escala tiene que cambiar con el zoom, si no miente. */
    const px = m => m / M_POR_U * k;
    let metros = PASOS_M.find(v => px(v) >= 78 && px(v) <= 190) || PASOS_M.reduce((a, b) => Math.abs(px(b) - 120) < Math.abs(px(a) - 120) ? b : a);
    const largo = px(metros);
    $(".ebar", chrome).setAttribute("x2", largo.toFixed(1));
    $(".etick2", chrome).setAttribute("x1", largo.toFixed(1));
    $(".etick2", chrome).setAttribute("x2", largo.toFixed(1));
    const t = $(".etxt", chrome);
    t.setAttribute("x", (largo / 2).toFixed(1));
    t.textContent = metros >= 1000 ? nf(metros / 1000, 1) + " km" : metros + " metros";
    $(".escala", chrome).setAttribute("transform", `translate(${(W - largo - 22).toFixed(0)},${(H - 20).toFixed(0)})`);
    $(".norte", chrome).setAttribute("transform", `translate(24,${(H - 16).toFixed(0)})`);
  }

  function encuadre(bx) {
    const m = 0.92, kx = W / (bx.x1 - bx.x0) * m, ky = H / (bx.y1 - bx.y0) * m;
    k = clamp(Math.min(kx, ky));
    tx = W / 2 - (bx.x0 + bx.x1) / 2 * k;
    ty = H / 2 - (bx.y0 + bx.y1) / 2 * k;
  }
  const verTodo = () => { encuadre({ x0: 0, y0: 0, x1: MAPW, y1: MAPH }); pintar(); };

  function medir(inicial) {
    W = fig.clientWidth || 600; H = fig.clientHeight || 340;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    if (inicial) {
      const f = zona.dataset.foco && byId(zona.dataset.foco);
      if (f) { const b = caja(f.poly); encuadre({ x0: b.x0 - 40, y0: b.y0 - 40, x1: b.x1 + 40, y1: b.y1 + 40 }); }
      else verTodo();
    }
    pintar();
  }

  function zoomEn(f, px, py) {
    const k2 = clamp(k * f);
    if (k2 === k) return;
    tx = px - (px - tx) * k2 / k; ty = py - (py - ty) * k2 / k; k = k2;
    pintar();
  }

  /* rueda */
  fig.addEventListener("wheel", ev => {
    ev.preventDefault();
    const r = svg.getBoundingClientRect();
    zoomEn(Math.pow(0.9988, ev.deltaY), ev.clientX - r.left, ev.clientY - r.top);
  }, { passive: false });

  /* arrastre y pellizco */
  const punteros = new Map();
  let ini = null, movido = 0;
  svg.addEventListener("pointerdown", ev => {
    if (ev.button === 2) return;
    svg.setPointerCapture(ev.pointerId);
    punteros.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
    movido = 0; arrastro = false;
    if (punteros.size === 2) {
      const [a, b] = [...punteros.values()];
      ini = { d: Math.hypot(a.x - b.x, a.y - b.y), k };
    }
  });
  svg.addEventListener("pointermove", ev => {
    const p = punteros.get(ev.pointerId);
    if (!p) return;
    const dx = ev.clientX - p.x, dy = ev.clientY - p.y;
    p.x = ev.clientX; p.y = ev.clientY;
    if (punteros.size === 2 && ini) {
      const [a, b] = [...punteros.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
      const r = svg.getBoundingClientRect();
      zoomEn(clamp(ini.k * d / ini.d) / k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      arrastro = true; return;
    }
    movido += Math.abs(dx) + Math.abs(dy);
    if (movido > 6) { arrastro = true; fig.classList.add("moviendo"); }
    if (arrastro) { tx += dx; ty += dy; pintar(); }
  });
  const soltar = ev => {
    punteros.delete(ev.pointerId);
    if (punteros.size < 2) ini = null;
    if (!punteros.size) { fig.classList.remove("moviendo"); setTimeout(() => { arrastro = false; }, 0); }
  };
  svg.addEventListener("pointerup", soltar);
  svg.addEventListener("pointercancel", soltar);
  svg.addEventListener("dblclick", ev => {
    const r = svg.getBoundingClientRect();
    zoomEn(1.8, ev.clientX - r.left, ev.clientY - r.top);
  });

  /* botones */
  $$("[data-z]", zona).forEach(b => b.addEventListener("click", () => {
    if (b.dataset.z === "fit") return verTodo();
    zoomEn(b.dataset.z === "in" ? 1.6 : 1 / 1.6, W / 2, H / 2);
  }));

  /* ---- capas ---- */
  const aplicar = () => {
    $$("[data-lay]", svg).forEach(el => { el.style.display = OFF.has(el.dataset.lid) ? "none" : ""; });
    CAPAS.forEach(g => {
      const items = itemsDe(g), apagados = items.filter(i => OFF.has(i)).length;
      const chk = $(`input[data-chk="${g.id}"]`, panel);
      if (!chk) return;
      chk.checked = apagados === 0;
      chk.indeterminate = apagados > 0 && apagados < items.length;
    });
  };
  $$("input[data-chk]", panel).forEach(chk => chk.addEventListener("change", () => {
    const g = grupoDe(chk.dataset.chk);
    if (g) {
      const items = itemsDe(g), todosOff = items.every(i => OFF.has(i));
      items.forEach(i => todosOff ? OFF.delete(i) : OFF.add(i));
      $$(`input[data-par="${g.id}"]`, panel).forEach(c => { c.checked = todosOff; });
    } else chk.checked ? OFF.delete(chk.dataset.chk) : OFF.add(chk.dataset.chk);
    aplicar();
    if (elegido && OFF.has(elegido)) limpiar();
  }));
  $$("[data-exp]", panel).forEach(b => b.addEventListener("click", () => {
    const grp = b.closest(".capagrp"), ab = grp.dataset.open === "1";
    grp.dataset.open = ab ? "0" : "1";
    b.setAttribute("aria-expanded", String(!ab));
  }));
  $$("[data-toggle]", panel).forEach(b => b.addEventListener("click", () => {
    const e = $("[data-exp]", b.closest(".capagrp")); if (e) e.click();
  }));

  /* cajon de capas en telefono: no le come alto al mapa */
  const btnCapas = $("#capasbtn", zona), cerrar = $("#capascerrar", panel);
  const abrirCapas = v => { panel.classList.toggle("open", v); btnCapas.setAttribute("aria-expanded", String(v)); };
  btnCapas.addEventListener("click", () => abrirCapas(!panel.classList.contains("open")));
  cerrar.addEventListener("click", () => abrirCapas(false));

  /* ---- seleccion: primero el nombre, recien despues se abre ---- */
  function limpiar() {
    elegido = null;
    $$(".capafila", panel).forEach(f => f.classList.remove("sel"));
    $$("[data-poly]", svg).forEach(e => e.classList.remove("elegido"));
    selBox.classList.remove("on"); selBox.innerHTML = "";
  }
  function mostrar(lid) {
    elegido = lid;
    $$(".capafila", panel).forEach(f => f.classList.toggle("sel", f.dataset.row === lid));
    $$("[data-poly]", svg).forEach(e => e.classList.toggle("elegido", e.dataset.poly === lid));
    const p = byId(lid);
    if (p) {
      selBox.innerHTML = `<span class="cod">${esc(p.cod)}</span>
        <span class="tx"><b>${esc(p.nom)}</b><span class="dt">${esc(p.tipo)} de ${esc(p.cultivo.toLowerCase())} · ${nf(p.ha, 1)} ha · ${p.resp.t}</span></span>
        ${chip(p.est)}<button class="btn" data-ir="${p.id}">${ico("flecha", 18)}Abrir</button>`;
      selBox.classList.add("on");
      $("[data-ir]", selBox).addEventListener("click", () => go("lote", p.id));
      const b = caja(p.poly);
      selBox.dataset.acercar = "1";
      return;
    }
    const d = DISPOS_MAPA.find(x => x.lid === lid);
    if (d) {
      selBox.innerHTML = `<span class="cod">${esc(d.cod)}</span><span class="tx"><b>Mide ${esc(KIND[d.t])}</b><span class="dt">está en ${esc(byId(d.p).cod)} · ${esc(byId(d.p).nom)} · última lectura ${esc(d.lect)}</span></span>`;
      selBox.classList.add("on"); return;
    }
    const a = AGUADAS.find(x => x.lid === lid);
    if (a) {
      selBox.innerHTML = `<span class="cod">${esc(a.cod)}</span><span class="tx"><b>${esc(a.nom)}</b><span class="dt">${esc(a.det)}</span></span>`;
      selBox.classList.add("on"); return;
    }
    limpiar();
  }

  $$("[data-sel]", panel).forEach(b => b.addEventListener("click", () => {
    const lid = b.dataset.sel;
    const p = byId(lid);
    if (p) { const c = caja(p.poly); encuadre({ x0: c.x0 - 30, y0: c.y0 - 30, x1: c.x1 + 30, y1: c.y1 + 30 }); pintar(); }
    else {
      const d = DISPOS_MAPA.find(x => x.lid === lid) || AGUADAS.find(x => x.lid === lid);
      if (d) { k = clamp(Math.max(k, 3.2)); tx = W / 2 - d.x * k; ty = H / 2 - d.y * k; pintar(); }
    }
    if (elegido === lid && b.dataset.ir) { go("lote", b.dataset.ir); return; }
    mostrar(lid);
    if (innerWidth < 820) abrirCapas(false);
  }));

  const tocar = (lid, ir) => { if (arrastro) return; (elegido === lid && ir) ? go("lote", ir) : mostrar(lid); };
  $$("[data-poly]", svg).forEach(el => {
    const p = byId(el.dataset.poly); if (!p) return;
    el.style.cursor = "pointer";
    el.addEventListener("click", () => tocar(p.id, p.id));
  });
  $$("[data-lay='aparatos'], [data-lay='agua'] ellipse", svg).forEach(el => {
    const g = el.closest("[data-lid]");
    el.style.cursor = "pointer";
    el.addEventListener("click", ev => { ev.stopPropagation(); tocar(g.dataset.lid); });
  });

  /* la lista de acciones sigue abriendo el potrero derecho */
  $$(".bigrow", root).forEach(b => b.addEventListener("click", () => go("lote", b.dataset.p)));

  aplicar();
  medir(true);
  let t; new ResizeObserver(() => { clearTimeout(t); t = setTimeout(() => medir(false), 80); }).observe(fig);
}

/* ============================ navegación ============================
   UNA sola app. Lo que cada persona ve lo decide su permiso, y eso NO se rotula
   en la pantalla: no hay ningun cartel que diga "vista de tal". Alguien sin el
   permiso de escribir reglas sencillamente no ve "Cuándo regar" en el menú.
==================================================================== */
const NAV = [
  ["El campo", [["hoy", "Hoy", "lista"], ["campo", "El campo entero", "lote"], ["lote", "Un potrero o un lote", "planta"], ["verde", "Cuánto pasto hay", "pasto"]]],
  ["El riego", [["riegos", "Qué regó y por qué", "gota"], ["cuando", "Cuándo regar", "reglas"]]],
  ["Anotar y aparatos", [["anotar", "Anotar algo", "lapiz"], ["aparatos", "Los aparatos", "aparato"], ["dibujar", "Dibujar el campo", "lote"], ["numeros", "Los números con detalle", "grafico"]]],
  ["La huerta de casa", [["hidro", "El agua de la hidroponía", "tanque"], ["pruebas", "Las pruebas", "bicho"]]],
  ["Todos los días", [["avisos", "Avisos", "alerta"], ["gente", "Quién entra y qué puede hacer", "gente"]]]
];
const TABS = [["hoy", "Hoy", "lista"], ["campo", "El campo", "lote"], ["anotar", "Anotar", "lapiz"], ["avisos", "Avisos", "alerta"]];

function buildNav() {
  $("#nav").innerHTML = NAV.map(([g, items]) => `
    <div class="navgroup">${esc(g)}</div>
    ${items.map(([k, lab, i]) => `<button class="navlink" data-k="${k}">${ico(i, 20)}<span>${esc(lab)}</span>${k === "avisos" ? '<span class="badge">2</span>' : ""}</button>`).join("")}`).join("");
  $$("#nav .navlink").forEach(b => b.addEventListener("click", () => { go(b.dataset.k); closeDrawer(); }));
  $("#tabbar").innerHTML = TABS.map(([k, l, i]) => `<button data-k="${k}"><b></b>${ico(i, 22)}${esc(l)}</button>`).join("");
  $$("#tabbar button").forEach(b => b.addEventListener("click", () => go(b.dataset.k)));
}
function go(k, arg) { location.hash = "#/" + k + (arg ? "/" + arg : ""); }

function render() {
  const parts = location.hash.replace(/^#\//, "").split("/").filter(Boolean);
  let k = parts[0] || "hoy";
  const arg = parts[1];
  if (!SCR[k]) k = "hoy";
  const scr = SCR[k](arg);
  const view = $("#view");
  view.innerHTML = scr.html;
  $("#drawerlabel").textContent = scr.title;
  document.title = scr.title + " · agro-platform (mockup)";
  $$("#nav .navlink").forEach(b => b.setAttribute("aria-current", b.dataset.k === k ? "page" : "false"));
  $$("#tabbar button").forEach(b => b.setAttribute("aria-current", b.dataset.k === k ? "page" : "false"));
  window.scrollTo(0, 0);
  if (scr.after) scr.after(view);
}
function closeDrawer() { $("#rail").classList.remove("open"); $("#scrim").classList.remove("on"); $("#drawerbtn").setAttribute("aria-expanded", "false"); }

$("#big").addEventListener("click", () => {
  const on = document.documentElement.getAttribute("data-big") === "1";
  document.documentElement.setAttribute("data-big", on ? "0" : "1");
  $("#big").textContent = on ? "Letra más grande" : "Letra normal";
});
$("#drawerbtn").addEventListener("click", () => {
  const open = $("#rail").classList.toggle("open");
  $("#scrim").classList.toggle("on", open);
  $("#drawerbtn").setAttribute("aria-expanded", String(open));
});
$("#scrim").addEventListener("click", closeDrawer);
$("#theme").addEventListener("click", () => {
  const d = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", d ? "light" : "dark");
  $("#theme").textContent = d ? "Tema oscuro" : "Tema claro";
  render();
});
if (matchMedia("(prefers-color-scheme: dark)").matches) {
  document.documentElement.setAttribute("data-theme", "dark");
  $("#theme").textContent = "Tema claro";
}
addEventListener("hashchange", render);
addEventListener("scroll", tipHide, { passive: true });
buildNav();
render();
</script>
</body>
</html>
