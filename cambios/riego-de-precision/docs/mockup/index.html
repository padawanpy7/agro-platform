<!doctype html>
<html lang="es-PY" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>agro-platform · mockup de pantallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F2F4F1; --panel:#FAFBF9; --panel-2:#EDF0EC;
  --ink:#132019; --ink-2:#46574C; --ink-3:#7B8A80;
  --line:#DCE2DB; --line-2:#C3CDC3;
  --brand:#0D4F5C; --brand-2:#0A3A44; --brand-wash:#E2EDEF;
  --ok:#2A7D46; --warn:#C06A05; --crit:#B3242F; --mute:#77877C;
  --ok-wash:#E4F0E7; --warn-wash:#F6EADB; --crit-wash:#F7E4E5; --mute-wash:#E9EDE9;
  --s1:#0284A8; --s2:#C06A05; --s3:#7C3AED; --s4:#BE123C;
  --d1:#6FAAC6; --d2:#1A5C7A; --d3:#0B3247;
  --n1:#98B478; --n2:#6F9B4D; --n3:#4F8235; --n4:#2A5A20; --n5:#113312;
  --grid:#E3E8E2; --axis:#BCC6BB;
  --shadow:none;
  --rail:232px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#141A17; --panel:#1B2320; --panel-2:#222B27;
  --ink:#E9EFE9; --ink-2:#AFBDB3; --ink-3:#8A9A8F;
  --line:#2C3833; --line-2:#3A4841;
  --brand:#5FBACB; --brand-2:#8FD3E0; --brand-wash:#17302F;
  --ok:#4FAF6C; --warn:#D5941F; --crit:#E3616A; --mute:#8A9A8F;
  --ok-wash:#1A2D21; --warn-wash:#2E2617; --crit-wash:#2E1C1E; --mute-wash:#232B27;
  --s1:#2AA3C6; --s2:#BD780C; --s3:#9B7BF5; --s4:#E5566F;
  --d1:#2E7FA3; --d2:#57A3C2; --d3:#8FC6DC;
  --n1:#2A5A20; --n2:#4F8235; --n3:#6F9B4D; --n4:#98B478; --n5:#BCD0A4;
  --grid:#26302B; --axis:#3D4A44;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Arial,sans-serif;
  font-variation-settings:"wdth" 100;
  font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,h4{margin:0; font-weight:650; font-variation-settings:"wdth" 112; letter-spacing:-.012em; line-height:1.18}
h1{font-size:26px} h2{font-size:19px} h3{font-size:15px} h4{font-size:13.5px}
p{margin:0 0 10px; max-width:68ch}
a{color:var(--brand); text-underline-offset:3px}
button{font:inherit; font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:2px}

/* ---- el cartel de mockup: no se cierra ---- */
.flag{
  background:repeating-linear-gradient(135deg,var(--warn-wash) 0 12px,transparent 12px 24px);
  border-bottom:1px solid var(--line-2);
  padding:7px 16px; font-size:12.5px; color:var(--ink-2);
  font-variation-settings:"wdth" 92; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;
}
.flag b{color:var(--ink); font-weight:700; font-variation-settings:"wdth" 108}

/* ---- shell ---- */
.shell{display:grid; grid-template-columns:var(--rail) 1fr; min-height:100vh}
.rail{
  border-right:1px solid var(--line); background:var(--panel);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow:auto;
}
.brand{display:flex; gap:10px; align-items:center; padding:16px 16px 14px; border-bottom:1px solid var(--line)}
.brand svg{flex:none}
.brand .nm{font-weight:750; font-variation-settings:"wdth" 116; letter-spacing:-.02em; font-size:16px; line-height:1}
.brand .sub{font-size:11px; color:var(--ink-3); font-variation-settings:"wdth" 86; line-height:1.3}
.tenant{padding:12px 16px; border-bottom:1px solid var(--line)}
.tenant label{display:block; font-size:11px; color:var(--ink-3); font-variation-settings:"wdth" 86; margin-bottom:4px}
.tenant select{
  width:100%; font:inherit; font-size:13.5px; background:var(--panel-2); color:var(--ink);
  border:1px solid var(--line-2); border-radius:2px; padding:6px 8px;
}
nav{padding:10px 8px 24px; flex:1}
.navgroup{font-size:11px; color:var(--ink-3); font-variation-settings:"wdth" 86; padding:14px 8px 5px; letter-spacing:.02em}
.navlink{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 8px; border:0; background:none; color:var(--ink-2); cursor:pointer;
  font-size:14px; border-radius:2px; position:relative;
}
.navlink:hover{background:var(--panel-2); color:var(--ink)}
.navlink[aria-current="page"]{color:var(--ink); font-weight:650; background:var(--brand-wash)}
.navlink[aria-current="page"]::before{content:""; position:absolute; left:-8px; top:4px; bottom:4px; width:3px; background:var(--brand)}
.navlink .dot{width:7px; height:7px; border-radius:50%; flex:none; background:var(--line-2)}
.navlink .badge{margin-left:auto; font-size:11px; background:var(--crit); color:#fff; border-radius:9px; padding:1px 6px; font-variation-settings:"wdth" 88}
:root[data-theme="dark"] .navlink .badge{color:#12100f}

main{min-width:0; padding:0 0 88px}
.wrap{max-width:1180px; padding:22px 22px 0}
.pagehead{border-bottom:1px solid var(--line); padding-bottom:14px; margin-bottom:18px}
.pagehead .decision{
  margin-top:7px; font-size:13.5px; color:var(--ink-2); max-width:72ch;
}
.pagehead .decision b{color:var(--ink); font-weight:650}
.crumb{font-size:11.5px; color:var(--ink-3); font-variation-settings:"wdth" 88; margin-bottom:6px}

/* ---- pieces ---- */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:3px; margin-bottom:16px}
.panel > header{padding:12px 14px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap}
.panel > header .hint{font-size:12px; color:var(--ink-3); font-variation-settings:"wdth" 88; margin-left:auto}
.panel .body{padding:14px}
.panel .body.flush{padding:0}
.cols{display:grid; gap:16px}
.cols.c2{grid-template-columns:1fr 1fr}
.cols.c3{grid-template-columns:repeat(3,1fr)}
.cols.map{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
.note{font-size:12.5px; color:var(--ink-2); font-variation-settings:"wdth" 94; line-height:1.45}
.note.rule{border-left:2px solid var(--brand); padding-left:10px}
.muted{color:var(--ink-3)}

.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; margin:1px 1px 17px}
.tile{background:var(--panel); outline:1px solid var(--line); padding:12px 14px; min-width:0}
.tile .k{font-size:11.5px; color:var(--ink-3); font-variation-settings:"wdth" 88; display:flex; align-items:center; gap:6px}
.tile .v{font-size:27px; font-weight:750; font-variation-settings:"wdth" 118; letter-spacing:-.02em; line-height:1.15; margin-top:3px}
.tile .v small{font-size:13px; font-weight:500; font-variation-settings:"wdth" 96; color:var(--ink-2); letter-spacing:0; margin-left:4px}
.tile .f{font-size:11.5px; color:var(--ink-3); font-variation-settings:"wdth" 90; margin-top:2px}

.chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-variation-settings:"wdth" 90; font-weight:600;
  padding:2px 7px 2px 5px; border-radius:2px; border:1px solid transparent; white-space:nowrap}
.chip .g{width:8px; height:8px; flex:none}
.chip.ok{background:var(--ok-wash); color:var(--ok); border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.chip.warn{background:var(--warn-wash); color:var(--warn); border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.chip.crit{background:var(--crit-wash); color:var(--crit); border-color:color-mix(in srgb,var(--crit) 32%,transparent)}
.chip.mute{background:var(--mute-wash); color:var(--ink-2); border-color:var(--line-2)}
.chip.ok .g{background:var(--ok); border-radius:50%}
.chip.warn .g{background:var(--warn); clip-path:polygon(50% 0,100% 100%,0 100%)}
.chip.crit .g{background:var(--crit); clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.chip.mute .g{background:none; border:1.5px dashed var(--ink-3); border-radius:50%}

table{width:100%; border-collapse:collapse; font-size:13.5px}
th{text-align:left; font-weight:600; font-size:11.5px; color:var(--ink-3); font-variation-settings:"wdth" 88;
  padding:9px 12px; border-bottom:1px solid var(--line-2); white-space:nowrap}
td{padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.scroller{overflow-x:auto}
.why{font-size:12px; color:var(--ink-3); font-variation-settings:"wdth" 92; line-height:1.4; display:block; margin-top:2px}

.btn{border:1px solid var(--line-2); background:var(--panel); color:var(--ink); border-radius:2px;
  padding:6px 11px; font-size:13.5px; cursor:pointer}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--brand); border-color:var(--brand); color:var(--panel)}
.btn.primary:hover{background:var(--brand-2)}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.btnrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.seg{display:inline-flex; border:1px solid var(--line-2); border-radius:2px; overflow:hidden}
.seg button{border:0; background:var(--panel); color:var(--ink-2); padding:5px 10px; font-size:13px; cursor:pointer; border-right:1px solid var(--line-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brand-wash); color:var(--ink); font-weight:650}

.kv{display:grid; grid-template-columns:auto 1fr; gap:5px 14px; font-size:13.5px; align-items:baseline}
.kv dt{color:var(--ink-3); font-size:12px; font-variation-settings:"wdth" 90; white-space:nowrap}
.kv dd{margin:0}

.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); font-variation-settings:"wdth" 92; align-items:center}
.legend span{display:inline-flex; gap:6px; align-items:center}
.legend i{width:14px; height:3px; border-radius:2px; display:block}
.legend i.sq{width:11px; height:11px; border-radius:2px}

.chart{position:relative}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.tip{position:fixed; z-index:60; pointer-events:none; background:var(--panel); border:1px solid var(--line-2);
  border-radius:3px; padding:8px 10px; font-size:12.5px; box-shadow:0 4px 14px rgba(0,0,0,.12); min-width:132px; opacity:0; transition:opacity .08s}
:root[data-theme="dark"] .tip{box-shadow:0 4px 18px rgba(0,0,0,.5)}
.tip .t{font-size:11px; color:var(--ink-3); font-variation-settings:"wdth" 88; margin-bottom:4px}
.tip .r{display:flex; gap:10px; justify-content:space-between; align-items:baseline}
.tip .r i{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:5px}
.tip .r b{font-weight:650}

.mapfig{background:var(--panel); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.mapfig svg{display:block; width:100%; height:auto}
.parcela-list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:3px; background:var(--panel); overflow:hidden}
.parcela-row{display:grid; grid-template-columns:4px 1fr auto; gap:0; border-bottom:1px solid var(--line); cursor:pointer; text-align:left; background:none; border-left:0; border-right:0; border-top:0; padding:0; color:inherit; font:inherit}
.parcela-row:last-child{border-bottom:0}
.parcela-row:hover,.parcela-row.hot{background:var(--panel-2)}
.parcela-row .bar{width:4px}
.parcela-row .mid{padding:9px 12px; min-width:0}
.parcela-row .nm{display:block; font-weight:650; font-size:14px; font-variation-settings:"wdth" 106}
.parcela-row .meta{display:block; font-size:11.5px; color:var(--ink-3); font-variation-settings:"wdth" 90; margin-top:1px}
.parcela-row .right{padding:9px 12px 9px 0; display:flex; align-items:center}

.timeline{display:grid; grid-template-columns:82px 1fr; gap:0 10px; align-items:center; font-size:11.5px}
.timeline .lab{color:var(--ink-3); font-variation-settings:"wdth" 88; text-align:right}

.gauge{display:grid; grid-template-columns:1fr; gap:3px}
.gauge .top{display:flex; justify-content:space-between; align-items:baseline}
.gauge .val{font-size:30px; font-weight:750; font-variation-settings:"wdth" 118; letter-spacing:-.022em; line-height:1}
.gauge .val small{font-size:13px; font-weight:500; font-variation-settings:"wdth" 96; color:var(--ink-2); letter-spacing:0; margin-left:3px}
.gauge .track{height:7px; background:var(--panel-2); border:1px solid var(--line); border-radius:2px; position:relative; margin-top:6px}
.gauge .ok-range{position:absolute; top:-1px; bottom:-1px; background:color-mix(in srgb,var(--ok) 26%,transparent); border-left:2px solid var(--ok); border-right:2px solid var(--ok)}
.gauge .needle{position:absolute; top:-3px; bottom:-3px; width:3px; background:var(--ink); border-radius:1px}
.gauge .scale{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-3); font-variation-settings:"wdth" 86; margin-top:3px}

.bloque{border:1px solid var(--line); border-radius:3px; background:var(--panel); overflow:hidden}
.bloque .cap{padding:9px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px}
.bloque .cap .id{display:inline-flex; align-items:center; gap:7px; font-weight:700; font-variation-settings:"wdth" 112}
.bloque .cap .id i{width:11px; height:11px; border-radius:2px; display:block}
.bloque .bd{padding:11px 12px}

.matrix td.y{color:var(--ok); font-weight:650}
.matrix td.n{color:var(--ink-3)}

.drawerbtn,.tabbar{display:none}
.skip{position:absolute; left:-9999px}
.skip:focus{left:8px; top:8px; z-index:99; background:var(--panel); padding:8px 12px; border:1px solid var(--brand)}

@media (max-width:960px){
  .cols.c2,.cols.c3,.cols.map{grid-template-columns:1fr}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed; inset:0 auto 0 0; width:272px; z-index:70; transform:translateX(-100%); transition:transform .18s ease; height:100dvh}
  .rail.open{transform:none; box-shadow:0 0 40px rgba(0,0,0,.28)}
  .scrim{position:fixed; inset:0; background:rgba(10,20,15,.42); z-index:65; display:none}
  .scrim.on{display:block}
  .drawerbtn{display:flex; align-items:center; gap:8px; position:sticky; top:0; z-index:40; width:100%;
    background:var(--panel); border:0; border-bottom:1px solid var(--line); padding:11px 14px; cursor:pointer; color:var(--ink); font-size:15px; font-weight:650}
  .wrap{padding:16px 14px 0}
  h1{font-size:22px}
  .tabbar{display:grid; grid-template-columns:repeat(4,1fr); position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:var(--panel); border-top:1px solid var(--line-2); padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{border:0; background:none; padding:9px 4px 10px; font-size:11px; color:var(--ink-3); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-variation-settings:"wdth" 90}
  .tabbar button[aria-current="page"]{color:var(--brand); font-weight:700}
  .tabbar button b{display:block; width:20px; height:3px; border-radius:2px; background:transparent}
  .tabbar button[aria-current="page"] b{background:var(--brand)}
  main{padding-bottom:76px}
  table{font-size:13px}
  th,td{padding:8px 9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
@media print{.rail,.tabbar,.drawerbtn{display:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Ir al contenido</a>

<div class="flag">
  <b>Mockup de diseño.</b>
  <span>No hay backend ni API. Todos los números, nombres y fechas son <b>de ejemplo</b> y ninguno salió de una medición real.</span>
  <button class="btn" id="theme" style="margin-left:auto; padding:2px 9px; font-size:12px">Tema oscuro</button>
</div>

<div class="scrim" id="scrim"></div>
<div class="shell">
  <aside class="rail" id="rail">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <path d="M3 8.5 L11 2.5 L23 6 L21.5 20 L8 23.5 Z" fill="none" stroke="var(--brand)" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="13" cy="12.5" r="2.6" fill="var(--brand)"/>
        <path d="M13 15.1 L13 21" stroke="var(--brand)" stroke-width="1.4" stroke-dasharray="2 2.2"/>
      </svg>
      <div>
        <div class="nm">agro-platform</div>
        <div class="sub">riego de precisión · fase 1</div>
      </div>
    </div>
    <div class="tenant">
      <label for="tenantsel">Cliente en contexto</label>
      <select id="tenantsel">
        <option>Estancia Yvoty (ejemplo)</option>
        <option>Huerta del patio (ejemplo)</option>
      </select>
      <div class="note" style="margin-top:6px; font-size:11.5px; color:var(--ink-3)">
        Cambiar de cliente cambia el <i>tenant</i> del token. No existe una vista “todos los clientes”.
      </div>
    </div>
    <nav id="nav" aria-label="Secciones"></nav>
  </aside>

  <main id="main">
    <button class="drawerbtn" id="drawerbtn" aria-expanded="false" aria-controls="rail">
      <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="M0 1h18M0 7h18M0 13h18" stroke="currentColor" stroke-width="1.8"/></svg>
      <span id="drawerlabel">Mapa de parcelas</span>
    </button>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div class="tabbar" id="tabbar"></div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ============================ util ============================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nf = (n, d) => Number(n).toLocaleString("es-PY", { minimumFractionDigits: d || 0, maximumFractionDigits: d === undefined ? 0 : d });
const gs = n => "Gs " + nf(n);
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
const CSSVAR = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ============================ datos de ejemplo ============================
   Todo lo de abajo es inventado para mirar el diseno. Ninguna cifra fue medida.
========================================================================= */

const EST = {
  ok:   { chip: "ok",   lab: "En rango" },
  warn: { chip: "warn", lab: "Atención" },
  crit: { chip: "crit", lab: "Crítico" },
  mute: { chip: "mute", lab: "Sin señal" }
};
const estColor = e => ({ ok: "var(--ok)", warn: "var(--warn)", crit: "var(--crit)", mute: "var(--mute)" }[e]);

const PARCELAS = [
  { id: "p4", nom: "Potrero Yvyra'i", cultivo: "Pasto (Brachiaria)", ha: 42.0, est: "ok",
    poly: "60,74 302,50 374,152 332,268 122,284 48,192", disp: 3, ndvi: 0.68,
    nota: "Estación meteorológica + 2 sensores de humedad" },
  { id: "p5", nom: "Potrero Costa Guasu", cultivo: "Pasto (Brachiaria)", ha: 58.4, est: "mute",
    poly: "424,62 802,46 882,182 838,320 562,342 442,232", disp: 2, ndvi: 0.52,
    nota: "Sin reportes desde el 25/09. El controlador sigue con la última política" },
  { id: "p1", nom: "Tomatal Ka'aguy", cultivo: "Tomate — Elpida", ha: 1.8, est: "warn",
    poly: "96,332 252,318 270,422 120,440", disp: 5, ndvi: 0.74,
    nota: "Humedad a 30 cm bajo el umbral de arranque desde hace 2 días" },
  { id: "p2", nom: "Sandial Tuyutî", cultivo: "Sandía — Crimson Sweet", ha: 3.2, est: "ok",
    poly: "302,332 472,354 488,472 324,464", disp: 4, ndvi: 0.63,
    nota: "Regó 2 veces hoy · 1.240 L estimados" },
  { id: "p3", nom: "Huerta Ñu Porâ", cultivo: "Tomate — Elpida", ha: 0.9, est: "crit",
    poly: "522,380 622,392 614,472 514,464", disp: 4, ndvi: 0.58,
    nota: "Caudalímetro midió 41 % más de lo estimado: fuga probable en la línea" },
  { id: "p6", nom: "Melonar Tape Pytâ", cultivo: "Sandía — Santa Amelia", ha: 2.4, est: "ok",
    poly: "662,372 832,358 854,474 674,488", disp: 3, ndvi: 0.66,
    nota: "Trampa de plagas: 4 capturas esta semana" }

}

const NS = "http://www.w3.org/2000/svg";
function S(tag, a) { const e = document.createElementNS(NS, tag); for (const k in a) if (a[k] !== undefined && a[k] !== null) e.setAttribute(k, a[k]); return e; }

/* Motor comun: lineas, areas, barras, bandas y crosshair. Un solo eje Y por panel. */
function drawPanel(g, cfg, geo) {
  const { x0, y0, w, h } = geo;
  const { yMin, yMax } = cfg;
  const sy = v => y0 + h - (v - yMin) / (yMax - yMin) * h;
  const n = cfg.xLen;
  const sx = i => n === 1 ? x0 + w / 2 : x0 + i / (n - 1) * w;

  (cfg.bands || []).forEach(b => {
    g.appendChild(S("rect", { x: x0, y: sy(b.to), width: w, height: Math.max(1, sy(b.from) - sy(b.to)), fill: b.color, opacity: b.op || 1 }));
    if (b.label) g.appendChild(Object.assign(S("text", { x: x0 + 5, y: sy(b.to) + 11, fill: "var(--ink-3)", "font-size": 10.5, "font-variation-settings": '"wdth" 88' }), { textContent: b.label }));
  });
  (cfg.vbands || []).forEach(b => {
    g.appendChild(S("rect", { x: sx(b.from), y: y0, width: sx(b.to) - sx(b.from), height: h, fill: "var(--panel-2)" }));
    g.appendChild(S("rect", { x: sx(b.from), y: y0, width: sx(b.to) - sx(b.from), height: h, fill: "none", stroke: "var(--axis)", "stroke-width": 1, "stroke-dasharray": "3 3" }));
    if (b.label) g.appendChild(Object.assign(S("text", { x: (sx(b.from) + sx(b.to)) / 2, y: y0 + h / 2 + 3, fill: "var(--ink-3)", "font-size": 10.5, "text-anchor": "middle", "font-variation-settings": '"wdth" 86' }), { textContent: b.label }));
  });

  (cfg.yTicks || []).forEach(t => {
    g.appendChild(S("line", { x1: x0, x2: x0 + w, y1: sy(t), y2: sy(t), stroke: "var(--grid)", "stroke-width": 1 }));
    g.appendChild(Object.assign(S("text", { x: x0 - 6, y: sy(t) + 3.5, fill: "var(--ink-3)", "font-size": 10.5, "text-anchor": "end", "font-variation-settings": '"wdth" 86' }), { textContent: cfg.yFmt ? cfg.yFmt(t) : t }));
  });
  (cfg.hlines || []).forEach(l => {
    g.appendChild(S("line", { x1: x0, x2: x0 + w, y1: sy(l.v), y2: sy(l.v), stroke: l.color, "stroke-width": 1.5, "stroke-dasharray": "5 4" }));
    if (l.label) g.appendChild(Object.assign(S("text", { x: x0 + w + 5, y: sy(l.v) + 3.5, fill: l.color, "font-size": 10.5, "font-weight": 650, "font-variation-settings": '"wdth" 88' }), { textContent: l.label }));
  });

  (cfg.series || []).forEach(s => {
    const vals = s.values;
    if (s.type === "band") {
      let d = "";
      for (let i = 0; i < vals.length; i++) d += (i ? "L" : "M") + sx(i).toFixed(1) + " " + sy(vals[i]).toFixed(1) + " ";
      for (let i = vals.length - 1; i >= 0; i--) d += "L" + sx(i).toFixed(1) + " " + sy(s.lower[i]).toFixed(1) + " ";
      g.appendChild(S("path", { d: d + "Z", fill: s.color, opacity: s.op || .22 }));
      return;
    }
    if (s.type === "bar") {
      const bw = Math.max(2, Math.min(14, w / n * (s.wide || 0.6)));
      vals.forEach((v, i) => {
        if (v === null || v === 0) return;
        const yv = sy(v), yb = sy(Math.min(yMax, Math.max(yMin, 0)));
        g.appendChild(S("rect", { x: sx(i) - bw / 2, y: Math.min(yv, yb), width: bw, height: Math.max(2, Math.abs(yb - yv)), fill: s.color, rx: 2, ry: 2 }));
      });
      return;
    }
    const segs = []; let cur = [];
    vals.forEach((v, i) => { if (v === null) { if (cur.length) segs.push(cur); cur = []; } else cur.push(i); });
    if (cur.length) segs.push(cur);
    if (s.fill) segs.forEach(seg => {
      if (seg.length < 2) return;
      let a = "M" + sx(seg[0]).toFixed(1) + " " + sy(yMin).toFixed(1) + " ";
      seg.forEach(i => { a += "L" + sx(i).toFixed(1) + " " + sy(vals[i]).toFixed(1) + " "; });
      a += "L" + sx(seg[seg.length - 1]).toFixed(1) + " " + sy(yMin).toFixed(1) + " Z";
      g.appendChild(S("path", { d: a, fill: s.color, opacity: s.fillOp || .14 }));
    });
    let d = "";
    segs.forEach(seg => seg.forEach((i, k) => { d += (k ? "L" : "M") + sx(i).toFixed(1) + " " + sy(vals[i]).toFixed(1) + " "; }));
    g.appendChild(S("path", { d, fill: "none", stroke: s.color, "stroke-width": s.w || 2, "stroke-linejoin": "round", "stroke-linecap": "round", "stroke-dasharray": s.dash || null }));
  });

  (cfg.marks || []).forEach(m => {
    g.appendChild(S("line", { x1: sx(m.i), x2: sx(m.i), y1: y0 + h, y2: y0 + h - 7, stroke: m.color, "stroke-width": 2 }));
  });

  g.appendChild(S("line", { x1: x0, x2: x0 + w, y1: y0 + h, y2: y0 + h, stroke: "var(--axis)", "stroke-width": 1 }));
  return { sx, sy };
}

function thinTicks(ticks, W) {
  const t = ticks || [];
  const step = W < 380 ? 3 : W < 560 ? 2 : 1;
  return step === 1 ? t : t.filter((_, k) => k % step === 0 || k === t.length - 1);
}

function mountChart(host, build) {
  const render = () => {
    const w = Math.max(260, host.clientWidth || 320);
    host.innerHTML = "";
    const svg = build(w);
    host.appendChild(svg);
  };
  render();
  let t; const ro = new ResizeObserver(() => { clearTimeout(t); t = setTimeout(render, 90); });
  ro.observe(host);
}

/* Grafico de LANES: varios paneles apilados que comparten el eje X.
   Se usa para la humedad por profundidad: la superficie arriba, 60 cm al fondo. */
function laneChart(host, cfg) {
  mountChart(host, W => {
    const padL = 42, padR = cfg.padR || 12, padT = 8, padB = 26, gap = cfg.gap === undefined ? 10 : cfg.gap;
    const lanes = cfg.lanes;
    const lh = cfg.laneH;
    const H = padT + lanes.length * lh + (lanes.length - 1) * gap + padB;
    const svg = S("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.aria || "" });
    const w = W - padL - padR;
    const geoms = [];
    lanes.forEach((L, k) => {
      const y0 = padT + k * (lh + gap);
      const g = S("g", {});
      svg.appendChild(g);
      const geo = { x0: padL, y0, w, h: lh };
      geoms.push(drawPanel(g, Object.assign({ xLen: cfg.xLen }, L), geo));
      svg.appendChild(Object.assign(S("text", { x: padL + 6, y: y0 + 13, fill: "var(--ink-2)", "font-size": 11.5, "font-weight": 650, "font-variation-settings": '"wdth" 96' }), { textContent: L.title }));
      if (L.sub && W > 520) svg.appendChild(Object.assign(S("text", { x: padL + w - 2, y: y0 + 13, fill: "var(--ink-3)", "font-size": 10.5, "text-anchor": "end", "font-variation-settings": '"wdth" 88' }), { textContent: L.sub }));
    });
    const yBot = padT + lanes.length * lh + (lanes.length - 1) * gap;
    thinTicks(cfg.xTicks, W).forEach(i => {
      const x = padL + i / (cfg.xLen - 1) * w;
      svg.appendChild(Object.assign(S("text", { x, y: yBot + 15, fill: "var(--ink-3)", "font-size": 10.5, "text-anchor": "middle", "font-variation-settings": '"wdth" 86' }), { textContent: cfg.xLabels[i] }));
    });

    const cross = S("line", { y1: padT, y2: yBot, stroke: "var(--ink)", "stroke-width": 1, opacity: 0, "pointer-events": "none" });
    svg.appendChild(cross);
    const ov = S("rect", { x: padL, y: padT, width: w, height: yBot - padT, fill: "transparent", style: "cursor:crosshair" });
    svg.appendChild(ov);
    const idxOf = ev => {
      const r = svg.getBoundingClientRect();
      const rel = (ev.clientX - r.left - padL) / w;
      return Math.max(0, Math.min(cfg.xLen - 1, Math.round(rel * (cfg.xLen - 1))));
    };
    const move = ev => {
      const i = idxOf(ev), x = padL + i / (cfg.xLen - 1) * w;
      cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("opacity", .35);
      let rows = "";
      lanes.forEach(L => (L.series || []).forEach(s => {
        if (s.skipTip) return;
        let v = s.values[i];
        if (v !== null && s.abs) v = Math.abs(v);
        rows += `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><b>${v === null ? "sin dato" : nf(v, s.dec === undefined ? 1 : s.dec) + (s.unit || "")}</b></div>`;
      }));
      tipShow(`<div class="t">${esc(cfg.xLabels[i])}</div>${rows}`, ev);
    };
    ov.addEventListener("pointermove", move);
    ov.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); tipHide(); });
    return svg;
  });
}

/* Un solo panel con crosshair. */
function lineChart(host, cfg) {
  mountChart(host, W => {
    const padL = cfg.padL || 42, padR = cfg.padR || 14, padT = 10, padB = 26;
    const H = cfg.h || 180;
    const svg = S("svg", { width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": cfg.aria || "" });
    const w = W - padL - padR, h = H - padT - padB;
    const g = S("g", {}); svg.appendChild(g);
    drawPanel(g, Object.assign({ xLen: cfg.xLen }, cfg), { x0: padL, y0: padT, w, h });
    thinTicks(cfg.xTicks, W).forEach(i => {
      const x = padL + i / (cfg.xLen - 1) * w;
      svg.appendChild(Object.assign(S("text", { x, y: padT + h + 15, fill: "var(--ink-3)", "font-size": 10.5, "text-anchor": "middle", "font-variation-settings": '"wdth" 86' }), { textContent: cfg.xLabels[i] }));
    });
    const cross = S("line", { y1: padT, y2: padT + h, stroke: "var(--ink)", "stroke-width": 1, opacity: 0, "pointer-events": "none" });
    svg.appendChild(cross);
    const ov = S("rect", { x: padL, y: padT, width: w, height: h, fill: "transparent", style: "cursor:crosshair" });
    svg.appendChild(ov);
    const move = ev => {
      const r = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(cfg.xLen - 1, Math.round((ev.clientX - r.left - padL) / w * (cfg.xLen - 1))));
      const x = padL + i / (cfg.xLen - 1) * w;
      cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("opacity", .35);
      let rows = "";
      (cfg.series || []).forEach(s => {
        if (s.skipTip) return;
        const v = s.values[i];
        rows += `<div class="r"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><b>${v === null ? "sin dato" : nf(v, s.dec === undefined ? 2 : s.dec) + (s.unit || "")}</b></div>`;

    ov.addEventListener("pointerleave", () => { cross.setAttribute("opacity", 0); tipHide(); });
    return svg;
  });
}

/* Barras horizontales con rotulo directo: ranking de potreros, bloques. */
function rankChart(host, cfg) {
  mountChart(host, W => {

    cfg.rows.forEach((r, k) => {

      g.appendChild(S("rect", { x: padL, y: y + 6, width: bw, height: 17, fill: r.color, rx: 4 }));

function sparkline(vals, color) {
  if (!vals) return "";
  const w = 72, h = 20, ok = vals.filter(v => v !== null);
  const mn = Math.min.apply(null, ok), mx = Math.max.apply(null, ok), r = (mx - mn) || 1;
  let d = "", open = false;
  vals.forEach((v, i) => {
    if (v === null) { open = false; return; }
    const x = i / (vals.length - 1) * w, y = h - (v - mn) / r * (h - 4) - 2;
    d += (open ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1) + " "; open = true;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="display:block"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}

const chip = e => `<span class="chip ${EST[e].chip}"><span class="g"></span>${EST[e].lab}</span>`;
const tile = (k, v, u, f) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}${u ? `<small>${u}</small>` : ""}</div>${f ? `<div class="f">${f}</div>` : ""}</div>`;
function head(crumb, title, decision) {
  return `<div class="pagehead"><div class="crumb">${esc(crumb)}</div><h1>${esc(title)}</h1><div class="decision">${decision}</div></div>`;
}
function gauge(g, label, dec) {
  const pct = v => ((v - g.min) / (g.max - g.min) * 100).toFixed(1) + "%";
  const okW = ((g.okMax - g.okMin) / (g.max - g.min) * 100).toFixed(1) + "%";
  return `<div class="gauge">
    <div class="top"><h3>${esc(label)}</h3>${chip(g.est)}</div>
    <div class="val">${nf(g.v, dec)}${g.u ? `<small>${g.u}</small>` : ""}</div>
    <div class="track"><div class="ok-range" style="left:${pct(g.okMin)}; width:${okW}"></div><div class="needle" style="left:calc(${pct(g.v)} - 1.5px)"></div></div>
    <div class="scale"><span>${nf(g.min, dec)}</span><span style="color:var(--ok)">objetivo ${nf(g.okMin, dec)}–${nf(g.okMax, dec)}</span><span>${nf(g.max, dec)}</span></div>
    <div class="note" style="margin-top:6px">${esc(g.nota)}</div>
  </div>`;
}

      </div>
    </div>`,
  after() { }
});

/* ---------- 12. Alta de parcela ---------- */

/* ============================ navegación ============================ */
const NAVGROUPS = [
  ["Campo", [["mapa", "Mapa de parcelas"], ["parcela", "Detalle de parcela"], ["series", "Series de mediciones"], ["riego", "Historial de riego"], ["politica", "Política de riego"], ["satelite", "Índice espacial"]]],
  ["Equipos", [["dispositivos", "Dispositivos y calibración"], ["parcelas-alta", "Alta y mensura de parcela"]]],
  ["Hidroponía", [["solucion", "Tablero de solución"], ["bloques", "Bloques experimentales"]]],
  ["Operación", [["alertas", "Alertas"], ["usuarios", "Usuarios y permisos"]]]
];
const NAVDOT = { mapa: "var(--warn)", parcela: "var(--warn)", riego: "var(--crit)", solucion: "var(--crit)", dispositivos: "var(--crit)" };

function buildNav() {
  $("#nav").innerHTML = NAVGROUPS.map(([g, items]) => `
    <div class="navgroup">${esc(g)}</div>
    ${items.map(([k, lab]) => `<button class="navlink" data-k="${k}">
      <span class="dot" style="background:${NAVDOT[k] || "var(--line-2)"}"></span>${esc(lab)}
      ${k === "alertas" ? '<span class="badge">2</span>' : ""}</button>`).join("")}`).join("");
  $$("#nav .navlink").forEach(b => b.addEventListener("click", () => { go(b.dataset.k); closeDrawer(); }));

  $("#tabbar").innerHTML = [["mapa", "Mapa"], ["riego", "Riego"], ["solucion", "Solución"], ["alertas", "Alertas"]]
    .map(([k, l]) => `<button data-k="${k}"><b></b>${esc(l)}</button>`).join("");
  $$("#tabbar button").forEach(b => b.addEventListener("click", () => go(b.dataset.k)));
}

function go(k) { location.hash = "#/" + k; }

function render() {
  const k = (location.hash.replace(/^#\//, "") || "mapa");
  const make = SCREENS[k] || SCREENS.mapa;
  const scr = make();
  const view = $("#view");
  view.innerHTML = scr.html;
  $("#drawerlabel").textContent = scr.title;
  document.title = scr.title + " · agro-platform (mockup)";
  $$("#nav .navlink").forEach(b => b.setAttribute("aria-current", b.dataset.k === k ? "page" : "false"));
  $$("#tabbar button").forEach(b => b.setAttribute("aria-current", b.dataset.k === k ? "page" : "false"));
  window.scrollTo(0, 0);
  if (scr.after) scr.after();
}

function closeDrawer() { $("#rail").classList.remove("open"); $("#scrim").classList.remove("on"); $("#drawerbtn").setAttribute("aria-expanded", "false"); }
$("#drawerbtn").addEventListener("click", () => {
  const open = $("#rail").classList.toggle("open");
  $("#scrim").classList.toggle("on", open);
  $("#drawerbtn").setAttribute("aria-expanded", String(open));
});
$("#scrim").addEventListener("click", closeDrawer);
$("#theme").addEventListener("click", () => {
  const d = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", d ? "light" : "dark");
  $("#theme").textContent = d ? "Tema oscuro" : "Tema claro";
  render();
});
if (matchMedia("(prefers-color-scheme: dark)").matches) {
  document.documentElement.setAttribute("data-theme", "dark");
  $("#theme").textContent = "Tema claro";
}
addEventListener("hashchange", render);
addEventListener("scroll", tipHide, { passive: true });
buildNav();
render();
</script>
</body>
</html>
